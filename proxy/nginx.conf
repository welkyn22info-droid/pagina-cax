server {
  listen 80;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name riesgo.interno;

  ssl_certificate     /etc/nginx/certs/servidor.crt;
  ssl_certificate_key /etc/nginx/certs/servidor.key;

  client_max_body_size 200M;      # archivos de posiciones grandes

  add_header X-Frame-Options DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy same-origin;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_read_timeout 1800s;      # corridas largas
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
  }
}
